name: Publish verified research website

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release containing site.tar.gz
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of the locally verified archive
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-candles-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download the authorized public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern site.tar.gz --dir incoming
      - name: Check archive, hashes, public paths and build versions
        env:
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: python verify_pages_archive.py incoming/site.tar.gz "$ARCHIVE_SHA256" site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1
      - name: Deploy the validated static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
